name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端 · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff
      - name: 代码规范
        run: ruff check .
      - name: 契约测试
        # 测试用临时 SQLite 库，无需外部服务
        run: pytest -q

  frontend:
    name: 前端 · 类型检查 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 类型检查与构建
        run: npm run build

  docker:
    name: 镜像可构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -t ivi-test-platform:ci ./backend
